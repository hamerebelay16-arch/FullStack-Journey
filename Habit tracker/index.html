<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Habit Tracker 📈</h1>
      <p class="subtitle">One step every day.</p>

      <div class="input-group">
        <input type="text" id="habit" placeholder="Enter a habit..." />
        <button id="enter">Add Habit</button>
      </div>
      <p id="errormessage"></p>
      <div id="habit-list"></div>
    </div>
  </body>
</html>
