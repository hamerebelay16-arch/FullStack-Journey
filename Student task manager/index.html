<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Manager</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="Todo_app.js" defer></script>
  </head>

  <body>
    <div class="whole-card">
      <header class="top-bar">
        <div>
          <h1>Academic Tasks</h1>
          <p>Stay ahead of every deadline.</p>
        </div>

        <div class="header-right">
          <span id="task-count"></span>

          <div class="actions">
            <button id="searchBtn" aria-label="Search tasks">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button id="filterBtn" aria-label="Filter tasks">
              <i class="fa-solid fa-filter"></i>
            </button>
          </div>
        </div>
      </header>

      <div class="search-panel hidden">
        <input type="search" id="search" placeholder="Search tasks..." />
      </div>

      <div class="filter-panel hidden">
        <button data-filter="all">All</button>
        <button data-filter="completed">Completed</button>
        <button data-filter="high">High</button>
        <button data-filter="medium">Medium</button>
        <button data-filter="low">Low</button>
      </div>

      <div class="add-task">
        <input type="text" id="added" placeholder="What needs to be done?" />

        <button id="addbtn">Add Task</button>
      </div>

      <ul class="show-task"></ul>

      <div class="empty-state hidden">
        <i class="fa-solid fa-clipboard-list"></i>
        <p>No tasks yet. Add one above!</p>
      </div>
    </div>

    <div id="toast"></div>
  </body>
</html>
