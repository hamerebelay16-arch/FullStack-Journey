<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Expense tracker</title>
  </head>
  <body>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <div class="app">
      <header class="hero">
        <div class="brand">
          <div class="logo" aria-hidden="true">ET</div>
          <div>
            <h1>Expense Tracker</h1>
            <p>See where your money goes.</p>
          </div>
        </div>
        <div class="hero-actions">
          <p class="hero-date" id="today-label"></p>
          <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M21 14.3A8.5 8.5 0 0 1 9.7 3a7 7 0 1 0 11.3 11.3z"
              />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="currentColor" />
              <path
                fill="currentColor"
                d="M11 1h2v3h-2V1zm0 19h2v3h-2v-3zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM3.8 3.8l2.1 2.1-1.4 1.4-2.1-2.1 1.4-1.4zm12.7 12.7 2.1 2.1-1.4 1.4-2.1-2.1 1.4-1.4zM3.8 20.2l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1zm12.7-12.7 1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1z"
              />
            </svg>
          </button>
        </div>
      </header>

      <section class="stats">
        <article class="stat-card stat-expense">
          <span class="stat-label">Expenses</span>
          <p class="stat-value">
            <span id="stat-expense">0.00</span>
            <small>birr</small>
          </p>
        </article>
        <article class="stat-card stat-income">
          <span class="stat-label">Income</span>
          <p class="stat-value">
            <span id="stat-income">0.00</span>
            <small>birr</small>
          </p>
        </article>
        <article class="stat-card stat-balance">
          <span class="stat-label">Balance</span>
          <p class="stat-value">
            <span id="stat-balance">0.00</span>
            <small>birr</small>
          </p>
        </article>
      </section>

      <section class="composer">
        <div class="card card-form add-dropdown" id="add-dropdown">
          <button type="button" id="add-toggle" class="add-toggle" aria-expanded="false">
            <span>Add transaction</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="add-panel">
            <div class="add-panel-inner">
              <div class="composer-grid">
                <label for="entry-type">
                  Type
                  <select id="entry-type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                  </select>
                </label>
                <label for="amount">
                  Amount (birr)
                  <input
                    type="number"
                    name="amount"
                    id="amount"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                  />
                </label>
                <label for="description">
                  Description
                  <input
                    type="text"
                    name="description"
                    id="description"
                    placeholder="Lunch, salary..."
                  />
                </label>
                <label for="date">
                  Date
                  <input type="date" name="date" id="date" />
                </label>
                <button type="button" id="savebtn">Save expense</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="ledger">
        <div class="ledger-head">
          <div>
            <h2>Transactions</h2>
            <p>Your latest income and spending.</p>
          </div>
          <button type="button" id="showbtn">Show</button>
        </div>
        <div class="display">
          <div class="display-inner">
            <table>
              <thead>
                <tr>
                  <th>Amount</th>
                  <th>Description</th>
                  <th>Date</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="displayTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <p id="message" class="toast" role="status"></p>
  </body>
</html>
